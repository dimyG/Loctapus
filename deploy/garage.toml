# Garage configuration for the local development stack. docker-compose.yml mounts this
# file at /etc/garage.toml, the default config path of the dxflrs/garage image.

replication_factor = 1

metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"

# rpc_secret is required even for a single node, but it is not here: compose
# injects it from deploy/.env as GARAGE_RPC_SECRET (an official env override),
# keeping the secret out of the repository. The admin API token likewise rides
# the GARAGE_ADMIN_TOKEN env override.
rpc_bind_addr = "[::]:3901"

[s3_api]
# Must stay identical to the s3_region default in backend Settings, or Garage rejects
# signatures with AuthorizationHeaderMalformed.
s3_region = "garage"
api_bind_addr = "0.0.0.0:3900"

[admin]
api_bind_addr = "0.0.0.0:3903"