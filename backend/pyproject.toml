[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-backend"
version = "0.1.0"
description = "RAG MVP backend (FastAPI + SQLAlchemy + pgvector)"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic-settings>=2.5",
    "PyJWT>=2.9",
    "pwdlib[argon2]>=0.2",
    "email-validator>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.28",
    "ruff>=0.16",
    "mypy>=2.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
filterwarnings = [
    # A SQLAlchemy warning means misuse; the suite must stay warning-free.
    "error::sqlalchemy.exc.SAWarning",
]

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import order
    "N",   # naming conventions
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "D",   # pydocstyle docstrings
    "PLR0917", # too-many-positional-arguments, forces keyword-only parameters
]
ignore = [
    "D202", # blank-line-after-function, conflicts with our required blank line after docstrings
    "D203", # one-blank-line-before-class, incompatible with D211
    "D213", # multi-line-summary-second-line, incompatible with D212
]

[tool.ruff.lint.per-file-ignores]
"alembic/**" = ["D"] # generated migration scripts

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency injection relies on calls in argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.security.HTTPBearer"]

[tool.ruff.lint.pylint]
# All parameters of our functions are keyword-only, so every call passes arguments by name.
max-positional-args = 0

[tool.mypy]
python_version = "3.14"
strict = true
