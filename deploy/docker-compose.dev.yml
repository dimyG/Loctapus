# Development overlay: live source reload on top of deploy/docker-compose.yml.
# Production (and the Hetzner override) never load this file.
#
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.dev.yml up --build --watch
#
# --build matters beyond the first run: watch starts from the images as they are, so
# edits made while the stack was stopped would only reach the containers on their next
# on-the-fly sync. A rebuild up front folds them in unconditionally (cached, cheap when
# nothing changed).
#
# Compose Watch copies host edits into the running containers instead of bind-mounting
# them, which is what makes this work from a Windows checkout: Docker Desktop does not
# reliably forward file-change events out of a Windows drive into the Linux VM, so a
# reloader would otherwise never see an edit.
#
# Backend services reload by container restart rather than by an in-process watcher:
# `sync+restart` needs no per-service command override, so the celery and dispatcher
# commands stay defined once in the base file and cannot drift from it.

# Shared watch rules for the three backend services. Compose Watch applies the build
# context's .dockerignore on top of the explicit ignores, so caches, egg-info, and
# backend/.env stay out of the sync already; tests/ and pyproject.toml are repeated
# here to keep this file's contract self-contained.
x-backend-watch: &backend-watch
  - action: sync+restart
    path: ../backend
    target: /app
    ignore:
      - tests/
      - pyproject.toml
      # Editor and tool output the .dockerignore does not cover; a stray file here must
      # not restart the three backend services.
      - .idea/
      - .vscode/
      - .coverage
      - htmlcov/
      - .hypothesis/
  # Every backend service carries the rebuild rule because each builds its own image
  # tag; a pyproject.toml change (a new dependency) must reach all three images, and
  # the builds share every layer, so the second and third are nearly free.
  - action: rebuild
    path: ../backend/pyproject.toml

services:
  # The dev stage installs the package editable, so the synced /app/app is the code the
  # process imports. Separate tags per service keep a rebuild of one from racing the
  # others' container recreation.
  api:
    build:
      target: dev
    image: rag-backend-dev-api
    develop:
      watch: *backend-watch

  worker:
    build:
      target: dev
    image: rag-backend-dev-worker
    develop:
      watch: *backend-watch

  dispatcher:
    build:
      target: dev
    image: rag-backend-dev-dispatcher
    develop:
      watch: *backend-watch

  # The dev stage runs Vite instead of Caddy: instant hot reload, no image rebuild for a
  # source edit. Vite proxies /api to the api service, so the URL and the same-origin
  # behavior match the production Caddy setup. Port stays 8080 for that reason.
  web:
    build:
      target: dev
    image: rag-web-dev
    environment:
      # Deliberately no VITE_ prefix: the value is config for Vite's own process, not
      # something client code should see through import.meta.env.
      API_PROXY_TARGET: http://api:8000
    develop:
      watch:
        - action: sync
          path: ../web
          target: /app
          ignore:
            - node_modules/
            - dist/
            - e2e/
            - test-results/
            - playwright-report/
            # The lockfile is handled by the rebuild rule alone: a sync would let Vite
            # see it before npm ci has installed the new dependency tree.
            - package-lock.json
        # Vite resolves its dependencies at startup, so a changed lockfile needs a
        # rebuild rather than a sync.
        - action: rebuild
          path: ../web/package-lock.json
